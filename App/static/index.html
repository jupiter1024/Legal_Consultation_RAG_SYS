<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LexAI | Premium Legal RAG Bot</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600&family=Inter:wght@400;500&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <div class="app-container">
        <!-- Sidebar -->
        <aside class="sidebar">
            <div class="logo">
                <i class="fas fa-balance-scale"></i>
                <span>LexAI</span>
            </div>
            
            <div class="upload-section">
                <h3>Documents</h3>
                <label for="file-upload" class="upload-btn">
                    <i class="fas fa-plus"></i> Upload PDF
                </label>
                <input type="file" id="file-upload" accept=".pdf" hidden>
                <div id="upload-status" class="status-indicator"></div>
            </div>

            <div class="footer-info">
                <p>Legal Assistant AI v1.0</p>
                <p>Powered by Llama 3.1 & Groq</p>
            </div>
        </aside>

        <!-- Main Chat Area -->
        <main class="chat-area">
            <header class="chat-header">
                <h2>Legal Consultation</h2>
                <div class="connection-status">
                    <span class="pulse"></span> Online
                </div>
            </header>

            <div id="chat-window" class="chat-window">
                <!-- Welcome Message -->
                <div class="message bot">
                    <div class="message-content">
                        Hello! I am your legal assistant. Upload a PDF document to begin, or ask me questions about your existing database.
                    </div>
                </div>
            </div>

            <div class="input-area">
                <div class="input-container">
                    <input type="text" id="user-input" placeholder="Ask a legal question..." autocomplete="off">
                    <button id="send-btn">
                        <i class="fas fa-paper-plane"></i>
                    </button>
                </div>
            </div>
        </main>
    </div>

    <!-- Source Modal -->
    <div id="source-modal" class="modal">
        <div class="modal-content">
            <span class="close-btn">&times;</span>
            <h3>Source Citations</h3>
            <div id="modal-body"></div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
