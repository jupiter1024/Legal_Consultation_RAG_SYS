# ═══════════════════════════════════════════════════════════════════════════
#  LinuxGPT — Docker Compose
#
#  Usage:
#    docker-compose up --build          # start the API
#    docker-compose exec api python -m scripts.ingest        # index PDFs
#    docker-compose exec api python -m scripts.ingest --force # re-index all
# ═══════════════════════════════════════════════════════════════════════════

version: "3.9"

services:

  # ── LinuxGPT API ─────────────────────────────────────────────────────────
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: linuxgpt-api
    ports:
      - "8001:8001"
    env_file:
      - .env
    volumes:
      # Persist FAISS index, processed chunks, and uploaded PDFs outside container
      - ./Data:/app/Data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c",
             "import urllib.request; urllib.request.urlopen('http://localhost:8001/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
